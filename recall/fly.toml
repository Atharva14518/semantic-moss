app = "recall-backend"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"
  # Build context is the recall/ directory (run `fly deploy` from recall/)

[env]
  PORT        = "8000"
  ENVIRONMENT = "production"
  LOG_LEVEL   = "INFO"

# Required secrets (set via `fly secrets set KEY=value`, never stored here):
#   DATABASE_URL
#   REDIS_URL
#   QDRANT_URL
#   MOSS_PROJECT_ID
#   MOSS_PROJECT_KEY
#   GROQ_API_KEY
#   LIVEKIT_URL
#   LIVEKIT_API_KEY
#   LIVEKIT_API_SECRET

[processes]
  web = "uvicorn main:app --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 30"

[http_service]
  internal_port       = 8000
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    grace_period = "30s"
    interval     = "15s"
    method       = "GET"
    timeout      = "10s"
    path         = "/health"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
